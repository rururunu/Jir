name: pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/ is the landing page; bat/version.json must stay reachable at
      # https://rururunu.github.io/Jir/bat/version.json — the index every jir
      # build fetches (src/jdk.rs).
      - name: Assemble the site
        run: |
          mkdir -p _site/bat
          cp -r site/. _site/
          cp bat/version.json _site/bat/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
